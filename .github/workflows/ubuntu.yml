name: CI on Ubuntu

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Setup CMake 4.2
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.2.x'

    - name: Install prerequisites
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends ninja-build xorg-dev libx11-dev libwayland-dev libgl1-mesa-dev

    - name: Cache external dependencies
      uses: actions/cache@v4
      id: cache-external
      with:
        path: external
        key: external-${{ hashFiles('bootstrap.sh') }}

    - name: Bootstrap
      if: steps.cache-external.outputs.cache-hit != 'true'
      run: bash ./bootstrap.sh

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel

    - name: Test
      run: ctest --test-dir ${{github.workspace}}/build --output-on-failure --timeout 60
