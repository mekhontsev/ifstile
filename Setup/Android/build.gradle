// Top-level build file where you can add configuration options common to all sub-projects/modules.

apply plugin: 'com.android.application'


def getCmakeVar(String varName) {
    def cmakeFile = file("../../version.cmake")
    def match = (cmakeFile.text =~ /${varName}\s+(.+)\)/)
    println("${varName} = " + match[0][1])
    return match[0][1]
}

def props = new Properties()
if (rootProject.file("keystore.properties").exists()) {
    props.load(new FileInputStream(rootProject.file("keystore.properties")))
}

android {
    compileSdk = 36
    defaultConfig {
        applicationId "com.ifstile"
        minSdkVersion 24
        targetSdk 34

        versionName getCmakeVar("PROJECT_VERSION")
        versionCode getCmakeVar("VERSION_CODE").toInteger()

        base.archivesName  = "$applicationId-v$versionName"
    }


   signingConfigs {
       release {
            storeFile file(props['storeFile'])
            storePassword props['storePassword']
            keyAlias props['keyAlias']
            keyPassword props['keyPassword']
       }
   }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
            'proguard-rules.pro',
            '../../external/SDL/android-project/app/proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            java.srcDirs += ['../../external/SDL/android-project/app/src/main/java']
            jniLibs.srcDirs = ['../../bin']
        }
    }
    namespace = 'com.ifstile'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar','*.so'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:2.3.20'))
}

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

